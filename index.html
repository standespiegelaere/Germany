<style>
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#101317; --surface:#171b21; --ink:#edf0f3; --ink2:#b3bcc7; --muted:#8a939e; --rule:#2a3038; --grid:#232930;
  --non:#6d6b66; --raw:#3f6ea8; --mem:#6aa6ef; --sig:#f0785f; --hi:#1b2837;}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#101317; --surface:#171b21; --ink:#edf0f3; --ink2:#b3bcc7; --muted:#8a939e; --rule:#2a3038; --grid:#232930;
  --non:#6d6b66; --raw:#3f6ea8; --mem:#6aa6ef; --sig:#f0785f; --hi:#1b2837;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);padding-inline:16px;padding-block:0 64px}
.wrap{max-width:1040px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);margin-inline:-16px;padding:10px 16px}
.topin{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font:500 13px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-right:auto}
nav.sec{display:flex;gap:14px;flex-wrap:wrap}
nav.sec a{color:var(--ink2);text-decoration:none;font-size:14px}
nav.sec a:hover{color:var(--mem)}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{font:500 13px/1 var(--sans);border:0;background:transparent;color:var(--ink2);padding:7px 11px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible,.tabs button:focus-visible,summary:focus-visible{outline:2px solid var(--mem);outline-offset:2px}
h1,h2,h3{font-family:var(--serif);font-weight:650;text-wrap:balance;margin:0}
h1{font-size:clamp(34px,5.2vw,54px);line-height:1.08;letter-spacing:-.01em}
h2{font-size:clamp(24px,3vw,31px);line-height:1.2}
h3{font-size:19px;line-height:1.3}
p{margin:0}
.lede{font-size:18px;color:var(--ink2);max-width:62ch}
section{padding-block:56px 8px;display:grid;gap:18px}
section+section{border-top:1px solid var(--rule);margin-top:40px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mem)}
.hero{padding-top:44px;display:grid;gap:22px}
.answer{font-family:var(--serif);font-size:clamp(20px,2.4vw,25px);line-height:1.4;max-width:40ch}
.answer b{color:var(--mem);font-weight:650}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.tile{background:var(--surface);padding:16px 16px 18px;display:grid;gap:6px;align-content:start}
.tile .num{font:500 34px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .num.neg{color:var(--mem)}
.tile .lab{font-size:13.5px;color:var(--ink2);line-height:1.4}
.msgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 32px;margin:0;padding:0;list-style:none}
.msgs li{padding-left:16px;border-left:2px solid var(--rule);font-size:15.5px;color:var(--ink)}
.msgs li b{font-weight:600}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:18px 18px 14px;display:grid;gap:12px}
.ctrl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.chart svg text{font-family:var(--sans);fill:var(--ink2)}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.tabs button{font:600 14.5px/1 var(--sans);border:0;background:transparent;color:var(--ink2);padding:11px 14px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--pc,var(--mem))}
.ptext{display:grid;gap:8px;max-width:70ch}
.ptext .big{font-family:var(--serif);font-size:20px;line-height:1.4}
.chip{display:inline-block;font:500 12px/1 var(--mono);padding:4px 7px;border-radius:4px;background:var(--hi);color:var(--ink)}
details{border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:14px 18px}
summary{cursor:pointer;font-weight:600}
details ul{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14.5px;color:var(--ink2)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font:13px/1.4 var(--sans);padding:7px 9px;border-radius:5px;max-width:260px;z-index:10;opacity:0;transition:opacity .1s}
footer{margin-top:40px;font-size:13px;color:var(--muted)}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.msgs,.two{grid-template-columns:1fr}nav.sec{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

en:{brand:"Union members & the vote · Germany 2025",nav1:"Controls",nav2:"East–West & AfD",nav3:"Drivers of AfD voting",nav4:"By party",nav5:"Loyalty",
eyebrow:"Politbarometer 2025 · 28,471 respondents with a party choice",hc:"Bundestag vote intention, 2025 (%)",hnote:"Raw weighted shares. Union members: n = 4,190. Hover for the adjusted gap after controls.",adjgap:"Adjusted gap",
h1:"Who do union members in Germany vote for?",
answer:"More SPD and Linke, less CDU/CSU and FDP than other voters. <b>The union electorate still leans left, but the classic SPD bond now rests on older members.</b> On the AfD, members differ little from comparable non-members.",
t1:"pts: SPD, members vs comparable non-members",t2:"pts: CDU/CSU, members vs comparable non-members",t3:"pts: Linke, members vs comparable non-members",t4:"pts: AfD, members vs comparable non-members (East: −4.8)",
m1:"<b>A left-leaning electorate.</b> 22% of union members intend to vote SPD and 13% Linke, against 15% and 10% of non-members; only 21% back the CDU/CSU (non-members 31%).",
m2:"<b>The SPD bond is generational.</b> In the West, members over 70 vote SPD 24 pts more than comparable non-members; under 45 there is no gap. The CDU/CSU gap mirrors it.",
m3:"<b>The Linke link is broad and female.</b> It holds at every age and is twice as strong among women (+7.7 vs +3.6 pts).",
m4:"<b>On the AfD, membership is no firewall.</b> Raw figures are similar (19% vs 17%); like-for-like, members are slightly less AfD-leaning, mainly men and in the East.",
s1e:"Controlling for composition",s1h:"How much is membership, how much is who members are?",
s1p:"Grey: non-members. Light blue: union members as they are. Dark blue: union members compared with non-members of the same profile. The gap between the two blues shows how much is composition.",
note_adj:"Dark blue = non-member share plus the adjusted membership gap from a weighted linear probability model controlling for gender, age, education, occupation, employment status, federal state, town size, survey month and interview mode. Whisker = 95% confidence interval. Hover for details.",
s2e:"East–West divide & the AfD",s2h:"The union–AfD link is stronger in the East, and among men",
s2p:"In West Germany, the raw gap even points the other way (+2.4) and disappears after controls. In the East, members are less AfD-leaning to begin with, and the gap widens to about 5 points like-for-like.",
s2c1:"AfD vote share by region",s2c2:"AfD vote share by gender, like-for-like",
note_sig:"Red difference = statistically significant (p < .05); grey = not significant. Faded bars: fewer than 60 union members in the group.",
s3e:"Main predictors",s3h:"What drives the AfD vote? Union membership barely registers",
s3p:"Share of the explained variation in AfD voting attributable to each factor (Shapley decomposition). Education, age, occupation and, nationally, the East–West divide matter far more. Together, social characteristics explain only 11–15% of who votes AfD.",
s3c:"Share of explained variation",note_dr:"Shapley values average each factor's added R² over all possible model orderings (weighted linear probability model). Nationally, 'federal state' includes the East–West divide.",
s4e:"By party",s4h:"Where union membership makes a difference",s4a:"By age",s4g:"By gender",
s5e:"Loyalty",s5h:"Does membership make voters more loyal? Only to the SPD, then the Linke",
s5p:"Share of each party's previous voters who still intend to vote for it. Before the election, membership kept 2021 SPD voters with the SPD. After it, members who had voted CDU/CSU left faster, and Linke voters stayed more loyal.",
note_loy:"Bars = raw shares; label = adjusted difference in points (members vs non-members). Previous vote is recalled: 2021 in Jan/Feb interviews, 2025 from March onwards.",
perA:"2021 → Jan/Feb 2025",perB:"Feb 2025 → Mar–Dec 2025",

Germany:"Germany",West:"West",East:"East",Men:"Men",Women:"Women",pts:"pts",ns:"n.s.",
interaction:"Interaction test",mh:"Data and method",
ml:["Data: Forschungsgruppe Wahlen, Politbarometer 2025 (GESIS ZA9151), cumulated monthly surveys, telephone and online. Outcome: Bundestag vote intention ('Sonntagsfrage'); respondents without a party choice are excluded (n = 28,471).",
"Union member = the respondent is a member. Reference group = no union member in the household; people living with a member are kept apart.",
"Controls: gender, age (11 groups), education (4), occupational status (7), employment status (6), federal state, town size, survey month, interview mode. Weighted (total weight nationally, representative weight within East/West). Robust standard errors.",
"East includes East Berlin, West includes West Berlin. Logit models give practically identical results.",
"The survey only asks whether someone is a union member. It has no information on activity (e.g. shop stewards, works council members), which union, or length of membership.",
"These are associations, not causal effects. One year of data cannot separate ageing from generational change. Recalled vote is subject to recall bias."],
foot:"Own calculations. Research note, 2026.",
party:{
"AfD":["In the raw numbers, union members are slightly more likely to vote AfD (18.6% vs 17.4%). Compared like-for-like, they are 1.9 pts less likely nationally and 4.8 pts less in the East.","The gap is almost entirely among men. Membership did not slow switching to the AfD during 2025."],
"SPD":["Union members are clearly more likely to vote SPD (+7.6 pts), but the bond is generational.","In West Germany, the gap is +24 pts among over-70s and absent under 45. In the East it is smaller (about +5) and flat."],
"CDU/CSU":["Members are about 10 pts less likely to vote CDU/CSU. Mirror image of the SPD: the gap grows with age.","Exceptions: civil servants and East German men show no gap. After the 2025 election, members who had voted CDU/CSU defected faster."],
"Linke":["Members are about 5 pts more likely to vote Linke, at almost every age.","The link is twice as strong among women (+7.7 vs +3.6 pts), and members who voted Linke in 2025 stayed more loyal."],
"Grüne":["Union members vote Greens about as often as comparable non-members (−0.5 pts).","No significant differences by region; detailed age and gender breakdowns were not computed for the Greens."],
"BSW":["No union effect at all: the gap stays within ±1.5 pts in every group.","Despite its pitch to working people, union members are no more likely to vote BSW."]}

de:{brand:"Gewerkschaftsmitglieder & Wahlverhalten · Deutschland 2025",nav1:"Kontrolliert",nav2:"Ost–West & AfD",nav3:"Faktoren der AfD-Wahl",nav4:"Nach Partei",nav5:"Treue",
eyebrow:"Politbarometer 2025 · 28.471 Befragte mit Parteipräferenz",hc:"Wahlabsicht Bundestag, 2025 (%)",hnote:"Gewichtete Rohanteile. Gewerkschaftsmitglieder: n = 4.190. Für den bereinigten Abstand mit der Maus über die Balken fahren.",adjgap:"Bereinigter Abstand",
h1:"Wen wählen Gewerkschaftsmitglieder in Deutschland?",
answer:"Mehr SPD und Linke, weniger CDU/CSU und FDP als andere Wähler. <b>Die Gewerkschaftswählerschaft steht weiter links, doch die klassische SPD-Bindung ruht heute auf älteren Mitgliedern.</b> Bei der AfD unterscheiden sich Mitglieder kaum von vergleichbaren Nichtmitgliedern.",
t1:"Punkte: SPD, Mitglieder vs. vergleichbare Nichtmitglieder",t2:"Punkte: CDU/CSU, Mitglieder vs. vergleichbare Nichtmitglieder",t3:"Punkte: Linke, Mitglieder vs. vergleichbare Nichtmitglieder",t4:"Punkte: AfD, Mitglieder vs. vergleichbare Nichtmitglieder (Ost: −4,8)",
m1:"<b>Eine links geneigte Wählerschaft.</b> 22% der Gewerkschaftsmitglieder wollen SPD und 13% Linke wählen, gegenüber 15% und 10% der Nichtmitglieder; nur 21% die CDU/CSU (Nichtmitglieder 31%).",
m2:"<b>Die SPD-Bindung ist eine Generationenfrage.</b> Im Westen wählen Mitglieder über 70 um 24 Punkte häufiger SPD als vergleichbare Nichtmitglieder; unter 45 gibt es keinen Abstand. Bei der CDU/CSU spiegelbildlich.",
m3:"<b>Die Linke-Bindung ist breit und weiblich.</b> Sie zeigt sich in jedem Alter und ist bei Frauen doppelt so stark (+7,7 vs. +3,6 Punkte).",
m4:"<b>Bei der AfD ist die Mitgliedschaft keine Brandmauer.</b> Roh ähnliche Anteile (19% vs. 17%); im fairen Vergleich wählen Mitglieder etwas seltener AfD, vor allem Männer und im Osten.",
s1e:"Zusammensetzung kontrolliert",s1h:"Was ist Mitgliedschaft, was ist Zusammensetzung?",
s1p:"Grau: Nichtmitglieder. Hellblau: Gewerkschaftsmitglieder, wie sie sind. Dunkelblau: Mitglieder im Vergleich zu Nichtmitgliedern mit gleichem Profil. Der Unterschied zwischen den beiden Blautönen zeigt den Effekt der Zusammensetzung.",
note_adj:"Dunkelblau = Anteil bei Nichtmitgliedern plus bereinigter Mitgliedschaftseffekt aus einem gewichteten linearen Wahrscheinlichkeitsmodell mit Kontrolle für Geschlecht, Alter, Bildung, Beruf, Erwerbsstatus, Bundesland, Ortsgröße, Befragungsmonat und Befragungsmodus. Linie = 95%-Konfidenzintervall. Für Details mit der Maus über die Balken fahren.",
s2e:"Ost–West-Gefälle & AfD",s2h:"Der Zusammenhang Gewerkschaft–AfD ist im Osten und bei Männern stärker",
s2p:"In Westdeutschland zeigt der Rohwert sogar in die andere Richtung (+2,4) und verschwindet nach Kontrolle. Im Osten wählen Mitglieder schon roh seltener AfD, und im fairen Vergleich wächst der Abstand auf rund 5 Punkte.",
s2c1:"AfD-Anteil nach Region",s2c2:"AfD-Anteil nach Geschlecht, fairer Vergleich",
note_sig:"Roter Abstand = statistisch signifikant (p < 0,05); grau = nicht signifikant. Blasse Balken: weniger als 60 Gewerkschaftsmitglieder in der Gruppe.",
s3e:"Wichtigste Faktoren",s3h:"Was erklärt die AfD-Wahl? Gewerkschaftsmitgliedschaft kaum",
s3p:"Anteil jedes Faktors an der erklärten Varianz der AfD-Wahl (Shapley-Zerlegung). Bildung, Alter, Beruf und, bundesweit, das Ost–West-Gefälle zählen weit mehr. Zusammen erklären soziale Merkmale nur 11–15% der AfD-Wahl.",
s3c:"Anteil an der erklärten Varianz",note_dr:"Shapley-Werte mitteln den R²-Zuwachs jedes Faktors über alle Reihenfolgen (gewichtetes lineares Wahrscheinlichkeitsmodell). Bundesweit enthält „Bundesland“ das Ost–West-Gefälle.",
s4e:"Nach Partei",s4h:"Wo Gewerkschaftsmitgliedschaft einen Unterschied macht",s4a:"Nach Alter",s4g:"Nach Geschlecht",
s5e:"Treue",s5h:"Macht Mitgliedschaft Wähler treuer? Nur bei der SPD, später bei der Linken",
s5p:"Anteil der früheren Wähler einer Partei, die sie weiterhin wählen wollen. Vor der Wahl hielt die Mitgliedschaft SPD-Wähler von 2021 bei der SPD. Danach wandten sich Mitglieder, die CDU/CSU gewählt hatten, schneller ab, und Linke-Wähler blieben treuer.",
note_loy:"Balken = Rohanteile; Zahl = bereinigter Abstand in Punkten (Mitglieder vs. Nichtmitglieder). Frühere Wahl ist erinnert: 2021 bei Befragungen im Jan./Feb., 2025 ab März.",
perA:"2021 → Jan./Feb. 2025",perB:"Feb. 2025 → März–Dez. 2025",

ml:["Daten: Forschungsgruppe Wahlen, Politbarometer 2025 (GESIS ZA9151), kumulierte Monatsbefragungen, telefonisch und online. Abhängige Variable: Wahlabsicht Bundestag (Sonntagsfrage); Befragte ohne Parteipräferenz sind ausgeschlossen (n = 28.471).",
"Gewerkschaftsmitglied = die befragte Person ist Mitglied. Vergleichsgruppe = kein Mitglied im Haushalt; Personen, die mit einem Mitglied zusammenleben, werden getrennt geführt.",
"Kontrollvariablen: Geschlecht, Alter (11 Gruppen), Bildung (4), beruflicher Status (7), Erwerbsstatus (6), Bundesland, Ortsgröße, Befragungsmonat, Befragungsmodus. Gewichtet (Gesamtgewicht bundesweit, Repräsentativgewicht innerhalb Ost/West). Robuste Standardfehler.",
"Ost einschließlich Ost-Berlin, West einschließlich West-Berlin. Logit-Modelle liefern praktisch identische Ergebnisse.",
"Die Befragung erfasst nur, ob jemand Gewerkschaftsmitglied ist. Angaben zu Aktivität (z. B. Vertrauensleute, Betriebsräte), zur Gewerkschaft oder zur Mitgliedsdauer fehlen.",
"Es handelt sich um Zusammenhänge, nicht um kausale Effekte. Ein Jahr Daten kann Alters- und Generationeneffekte nicht trennen. Die erinnerte Wahl unterliegt Erinnerungsfehlern."],
foot:"Eigene Berechnungen. Forschungsnotiz, 2026.",

"AfD":["In den Rohzahlen wählen Gewerkschaftsmitglieder etwas häufiger AfD (18,6% vs. 17,4%). Im fairen Vergleich sind es bundesweit 1,9 Punkte weniger, im Osten 4,8 Punkte weniger.","Der Abstand besteht fast nur bei Männern. Den Wechsel zur AfD im Jahr 2025 hat die Mitgliedschaft nicht gebremst."],
"SPD":["Gewerkschaftsmitglieder wählen deutlich häufiger SPD (+7,6 Punkte), doch die Bindung ist eine Generationenfrage.","Im Westen beträgt der Abstand bei über 70-Jährigen +24 Punkte, unter 45 gibt es keinen. Im Osten ist er kleiner (rund +5) und gleichmäßig."],
"CDU/CSU":["Mitglieder wählen rund 10 Punkte seltener CDU/CSU, spiegelbildlich zur SPD: Der Abstand wächst mit dem Alter.","Ausnahmen: Beamte und ostdeutsche Männer zeigen keinen Abstand. Nach der Wahl 2025 wandten sich Mitglieder, die CDU/CSU gewählt hatten, schneller ab."],
"Linke":["Mitglieder wählen rund 5 Punkte häufiger Linke, in fast jedem Alter.","Bei Frauen ist der Zusammenhang doppelt so stark (+7,7 vs. +3,6 Punkte), und Mitglieder, die 2025 Linke wählten, blieben treuer."],
"Grüne":["Gewerkschaftsmitglieder wählen etwa so oft Grüne wie vergleichbare Nichtmitglieder (−0,5 Punkte).","Keine signifikanten regionalen Unterschiede; Alters- und Geschlechtsaufschlüsselungen wurden für die Grünen nicht berechnet."],
"BSW":["Kein Gewerkschaftseffekt: Der Abstand bleibt in jeder Gruppe innerhalb von ±1,5 Punkten.","Trotz seiner Ansprache an Arbeitnehmer wählen Gewerkschaftsmitglieder nicht häufiger BSW."]}
}};
const FACT={en:{"Union membership":"Union membership","Gender":"Gender","Age":"Age","Education":"Education","Occupational status":"Occupational status","Employment status":"Employment status","Federal state":"Federal state","Town size":"Town size","Survey month":"Survey month","Interview mode":"Interview mode"},
de:{"Union membership":"Gewerkschaftsmitgliedschaft","Gender":"Geschlecht","Age":"Alter","Education":"Bildung","Occupational status":"Beruflicher Status","Employment status":"Erwerbsstatus","Federal state":"Bundesland","Town size":"Ortsgröße","Survey month":"Befragungsmonat","Interview mode":"Befragungsmodus"}};
const PC={"Grüne":"#46962b","CDU/CSU":"#3a3a3a","SPD":"#e3000f","Linke":"#be3075","AfD":"#009ee0","BSW":"#d99a00"};
let lang=((navigator.language||"").slice(0,2)==="de")?"de":"en"; try{const s=localStorage.getItem("uv-lang");if(s)lang=s}catch(e){}
const st={ov:"Germany",dr:"Germany",age:"West",gen:"Germany",loy:"B",party:"SPD"};
const t=k=>I[lang][k]??k;
const fmt=(v,d=1)=>{const s=Math.abs(v).toFixed(d);const x=lang==="de"?s.replace(".",","):s;return (v<0?"−":"")+x};
const sgn=v=>(v>0?"+":"")+fmt(v);
const sig=(g,se)=>Math.abs(g)>1.96*se;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NS="http://www.w3.org/2000/svg";
function el(n,a,p){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
const tip=document.getElementById("tip");
function hover(node,html){node.addEventListener("mousemove",e=>{tip.innerHTML=html();tip.style.opacity=1;const x=Math.min(e.clientX+14,innerWidth-270);tip.style.left=x+"px";tip.style.top=(e.clientY+14)+"px"});node.addEventListener("mouseleave",()=>tip.style.opacity=0)}
function legend(id,items){document.getElementById(id).innerHTML=items.map(([c,l])=>`<span><i class="sw" style="background:var(${c})"></i>${l}</span>`).join("")}
function seg(id,opts,key,cb){const c=document.getElementById(id);c.innerHTML="";opts.forEach(([v,l])=>{const b=document.createElement("button");b.textContent=l;b.id=id+"-"+v.replace(/\W/g,"");b.setAttribute("aria-pressed",st[key]===v);b.onclick=()=>{st[key]=v;cb();seg(id,opts,key,cb)};c.appendChild(b)})}

/* grouped bar chart. groups:[{label, sub?, bars:[{v,c,lo,hi,faded,tip}], gap:{g,se}|null}] */
function bars(id,groups,{h=300,max=null,gapTop=true}={}){
  const box=document.getElementById(id);box.innerHTML="";
  const nb0=groups[0].bars.length,W=Math.max(520,groups.length*nb0*38+120),H=h,m={t:40,r:10,b:groups.some(g=>g.sub)?54:36,l:40};
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"},box);svg.style.minWidth=(groups.length*nb0>12)?"620px":"0";
  let top=max||Math.ceil((Math.max(...groups.flatMap(g=>g.bars.map(b=>Math.max(b.v,b.hi||0))))*1.12)/10)*10;
  const y=v=>m.t+(H-m.t-m.b)*(1-v/top), iw=W-m.l-m.r, gw=iw/groups.length, nb=groups[0].bars.length, bw=Math.min(34,(gw*0.78)/nb);
  const step=top>60?20:10;
  for(let v=0;v<=top;v+=step){el("line",{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),stroke:css("--grid")},svg);const tx=el("text",{x:m.l-6,y:y(v)+4,"text-anchor":"end","font-size":11},svg);tx.textContent=v+"%"}
  groups.forEach((g,i)=>{
    const cx=m.l+gw*i+gw/2, x0=cx-(nb*bw+(nb-1)*3)/2;
    let hiTop=0;
    g.bars.forEach((b,j)=>{
      const x=x0+j*(bw+3), yy=y(b.v);
      const r=el("rect",{x,y:yy,width:bw,height:Math.max(0,y(0)-yy),fill:css(b.c),rx:2,opacity:b.faded?.45:1},svg);
      let tp=yy;
      if(b.lo!=null){el("line",{x1:x+bw/2,x2:x+bw/2,y1:y(Math.max(0,b.lo)),y2:y(Math.min(top,b.hi)),stroke:css("--ink2"),"stroke-width":1.3},svg);tp=Math.min(tp,y(b.hi))}
      const lb=el("text",{x:x+bw/2,y:tp-5,"text-anchor":"middle","font-size":10.5,"font-weight":b.bold?600:400,fill:css("--ink")},svg);lb.textContent=fmt(b.v);
      hiTop=Math.max(hiTop,b.hi||b.v);
      const hit=el("rect",{x:x-2,y:m.t,width:bw+4,height:y(0)-m.t,fill:"transparent"},svg);if(b.tip)hover(hit,b.tip);
    });
    if(g.gap&&gapTop){const s=g.gap.s!=null?g.gap.s:sig(g.gap.g,g.gap.se);const tx=el("text",{x:cx,y:Math.max(12,y(hiTop)-22),"text-anchor":"middle","font-size":12,"font-weight":s?600:400,fill:s?css("--sig"):css("--muted")},svg);tx.textContent=sgn(g.gap.g)+(s?"":" "+t("ns"))}
    const lx=el("text",{x:cx,y:H-m.b+18,"text-anchor":"middle","font-size":13,"font-weight":600,fill:css("--ink")},svg);lx.textContent=g.label;
    if(g.sub){const sx=el("text",{x:cx,y:H-m.b+36,"text-anchor":"middle","font-size":11,fill:css("--muted")},svg);sx.textContent=g.sub}
  });
  el("line",{x1:m.l,x2:W-m.r,y1:y(0),y2:y(0),stroke:css("--muted")},svg);
}
const tipRow=(title,rows)=>`<b>${title}</b><br>`+rows.map(([a,b])=>`${a}: ${b}`).join("<br>");
function drawHero(){
  const rows=D.ov.Germany;
  bars("ch-hero",rows.map(r=>({label:r.p,gap:{g:r.mem-r.non,s:false},bars:[
    {v:r.non,c:"--non",tip:()=>tipRow(r.p,[[t("non"),fmt(r.non)+"%"]])},
    {v:r.mem,c:"--mem",bold:1,tip:()=>tipRow(r.p,[[t("mem"),fmt(r.mem)+"%"],[t("adjgap"),sgn(r.gap)+" "+t("pts")]])}]})),{h:290,gapTop:false});
  legend("lg-hero",[["--non",t("non")],["--mem",t("mem")]]);
}
function drawOverview(){
  const rows=D.ov[st.ov];
  bars("ch-ov",rows.map(r=>{const a=r.non+r.gap;return{label:r.p,gap:{g:r.gap,se:r.se},bars:[
    {v:r.non,c:"--non",tip:()=>tipRow(r.p,[[t("non"),fmt(r.non)+"%"]])},
    {v:r.mem,c:"--raw",tip:()=>tipRow(r.p,[[t("raw"),fmt(r.mem)+"%"]])},
    {v:a,c:"--mem",bold:1,lo:a-1.96*r.se,hi:a+1.96*r.se,tip:()=>tipRow(r.p,[[t("adj"),fmt(a)+"%"],["95% CI",fmt(a-1.96*r.se)+"–"+fmt(a+1.96*r.se)],[t("pts"),sgn(r.gap)]])}]}}),{h:330});
  legend("lg-ov",[["--non",t("non")],["--raw",t("raw")],["--mem",t("adj")]]);
}
function drawEW(){
  bars("ch-ew",["Germany","West","East"].map(reg=>{const r=D.ov[reg].find(x=>x.p==="AfD"),a=r.non+r.gap;return{label:t(reg),gap:{g:r.gap,se:r.se},bars:[
    {v:r.non,c:"--non",tip:()=>tipRow(t(reg),[[t("non"),fmt(r.non)+"%"]])},{v:r.mem,c:"--raw",tip:()=>tipRow(t(reg),[[t("raw"),fmt(r.mem)+"%"]])},
    {v:a,c:"--mem",bold:1,lo:a-1.96*r.se,hi:a+1.96*r.se,tip:()=>tipRow(t(reg),[[t("adj"),fmt(a)+"%"],[t("pts"),sgn(r.gap)]])}]}}),{h:300,max:35});
  legend("lg-ew",[["--non",t("non")],["--raw",t("raw")],["--mem",t("adj")]]);
  const G=D.mods.AfD.gender;const groups=[];
  ["Germany","West","East"].forEach(reg=>G[reg].rows.forEach(r=>{const a=r.non+r.gap;groups.push({label:t(r.l),sub:t(reg),gap:{g:r.gap,se:r.se},bars:[
    {v:r.non,c:"--non",tip:()=>tipRow(t(reg)+" · "+t(r.l),[[t("non"),fmt(r.non)+"%"]])},
    {v:a,c:"--mem",bold:1,lo:a-1.96*r.se,hi:a+1.96*r.se,tip:()=>tipRow(t(reg)+" · "+t(r.l),[[t("adj"),fmt(a)+"%"],[t("pts"),sgn(r.gap)],["n",r.n]])}]})}));
  bars("ch-g",groups,{h:300,max:40});legend("lg-g",[["--non",t("non")],["--mem",t("adj")]]);
}
function drawDrivers(){
  const box=document.getElementById("ch-dr");box.innerHTML="";const S=D.shap[st.dr];
  const keys=Object.keys(S).sort((a,b)=>S[b]-S[a]);const W=720,rh=30,m={t:6,l:210,r:60},H=m.t+keys.length*rh+10;
  const svg=el("svg",{viewBox:`0 0 ${W} ${H}`,role:"img"},box);const mx=25,x=v=>m.l+(W-m.l-m.r)*v/mx;
  [0,5,10,15,20,25].forEach(v=>el("line",{x1:x(v),x2:x(v),y1:m.t,y2:H-10,stroke:css("--grid")},svg));
  keys.forEach((k,i)=>{const yy=m.t+i*rh,u=k==="Union membership";
    const lb=el("text",{x:m.l-10,y:yy+rh/2+4,"text-anchor":"end","font-size":13,"font-weight":u?600:400,fill:u?css("--sig"):css("--ink")},svg);lb.textContent=FACT[lang][k];
    el("rect",{x:m.l,y:yy+6,width:Math.max(2,x(S[k])-m.l),height:rh-12,rx:2,fill:u?css("--sig"):css("--mem")},svg);
    const v=el("text",{x:x(S[k])+6,y:yy+rh/2+4,"font-size":12,fill:css("--ink")},svg);v.textContent=fmt(S[k])+"%";
    const hit=el("rect",{x:0,y:yy,width:W,height:rh,fill:"transparent"},svg);hover(hit,()=>tipRow(FACT[lang][k],[[t("s3c"),fmt(S[k])+"%"],["R² total",fmt(D.shap._r2[st.dr],3)]]))});
}
function modChart(id,party,mod,reg,pid){
  const M=D.mods[party][mod][reg];const groups=M.rows.map(r=>{const a=r.non+r.gap;const lab=mod==="gender"?t(r.l):r.l;return{label:lab,gap:{g:r.gap,se:r.se},bars:[
    {v:r.non,c:"--non",tip:()=>tipRow(party+" · "+lab,[[t("non"),fmt(r.non)+"%"]])},
    {v:Math.max(0,a),c:"--mem",bold:1,faded:r.n<60,lo:a-1.96*r.se,hi:a+1.96*r.se,tip:()=>tipRow(party+" · "+lab,[[t("adj"),fmt(a)+"%"],[t("pts"),sgn(r.gap)],["n",r.n]])}]}});
  bars(id,groups,{h:290});const p=M.p;document.getElementById(pid).textContent=`${t("interaction")} (${t(reg)}): p ${p<.001?"< 0"+(lang==="de"?",":".")+"001":"= "+fmt(p,3)}`;
}
function drawParty(){
  const tabs=document.getElementById("ptabs");tabs.innerHTML="";
  ["SPD","CDU/CSU","Linke","Grüne","AfD","BSW"].forEach(p=>{const b=document.createElement("button");b.setAttribute("role","tab");b.id="tab-"+p.replace("/","");b.textContent=p;b.style.setProperty("--pc",PC[p]);b.setAttribute("aria-selected",st.party===p);b.onclick=()=>{st.party=p;drawParty()};tabs.appendChild(b)});
  const tx=I[lang].party[st.party];const ov=D.ov.Germany.find(x=>x.p===st.party);
  document.getElementById("ptext").innerHTML=`<p class="big">${tx[0]}</p><p>${tx[1]}</p><p><span class="chip">${t("Germany")}: ${sgn(ov.gap)} ${t("pts")}</span> <span class="chip">${t("West")}: ${sgn(D.ov.West.find(x=>x.p===st.party).gap)}</span> <span class="chip">${t("East")}: ${sgn(D.ov.East.find(x=>x.p===st.party).gap)}</span></p>`;
  seg("reg-age",[["West",t("West")],["East",t("East")],["Germany",t("Germany")]],"age",drawParty);
  seg("reg-gen",[["Germany",t("Germany")],["West",t("West")],["East",t("East")]],"gen",drawParty);
  const has=!!D.mods[st.party];document.querySelectorAll("#parties .two").forEach(x=>x.hidden=!has);
  if(has){modChart("ch-age",st.party,"agegrp",st.age,"p-age");modChart("ch-gen",st.party,"gender",st.gen,"p-gen");}
  legend("lg-age",[["--non",t("non")],["--mem",t("adj")]]);legend("lg-gen",[["--non",t("non")],["--mem",t("adj")]]);
}
function drawLoy(){
  const rows=D.loy[st.loy].filter(r=>r.p!=="All parties");
  bars("ch-loy",rows.map(r=>({label:r.p,gap:{g:r.gap,s:r.pv<.05},bars:[
    {v:r.non,c:"--non",tip:()=>tipRow(r.p,[[t("non"),fmt(r.non)+"%"]])},
    {v:r.mem,c:"--mem",bold:1,faded:r.n<60,tip:()=>tipRow(r.p,[[t("mem"),fmt(r.mem)+"%"],[t("pts"),sgn(r.gap)],["p",fmt(r.pv,3)],["n",r.n]])}]})),{h:300,max:100});
  legend("lg-loy",[["--non",t("non")],["--mem",t("mem")]]);
}
function render(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{e.innerHTML=t(e.dataset.t)});
  document.querySelectorAll(".topin .seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  document.getElementById("mlist").innerHTML=I[lang].ml.map(x=>`<li>${x}</li>`).join("");
  seg("reg-ov",[["Germany",t("Germany")],["West",t("West")],["East",t("East")]],"ov",drawOverview);
  seg("reg-dr",[["Germany",t("Germany")],["West",t("West")],["East",t("East")]],"dr",drawDrivers);
  seg("per-loy",[["A",t("perA")],["B",t("perB")]],"loy",drawLoy);
  drawHero();drawOverview();drawEW();drawDrivers();drawParty();drawLoy();
}
document.querySelectorAll(".topin .seg button").forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem("uv-lang",lang)}catch(e){}render()});
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",render);
new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
render();
</script>
